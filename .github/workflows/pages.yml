# Publishes the one-pager (site/index.html) and the static demo (site/demo/) to GitHub Pages.
#
# Pages is switched on in the repository settings with the source "GitHub Actions". The custom domain is NOT set here: a CNAME file is ignored when a workflow publishes,
# so the domain lives in those settings too.
#
# What it does: replays the recorded run, builds the demo from it, copies the files the one-pager links (diagram, screenshot, sample report, fonts) into site/, checks the
# one-pager (tests/test_site.py), then uploads site/ as the Pages artifact. The run is the committed bundle at DEMO_BUNDLE below: the benign generated sample
# (`swarmlabre demo --variant two`) analysed with the scripted mock model and exported (`swarmlabre export --with-sample`); it is also the golden case `elf-dispute`.
# Nothing is installed: the build is Python 3.12 standard library only.
name: pages

on:
  push:
    branches: [main]
    paths: ["swarmlabre/**", "ui/**", "tools/build-demo.py", "tools/shim.js", "demo/**", "site/**", "docs/architecture.svg", "docs/img/demo-1280.png", ".github/workflows/pages.yml"]
  workflow_dispatch:

env:
  DEMO_BUNDLE: demo/sfaef16e6

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay the recording (fails if it is not byte for byte what was recorded)
        run: python3 -m swarmlabre replay "$DEMO_BUNDLE"
      - name: Build the static demo
        run: python3 tools/build-demo.py "$DEMO_BUNDLE" --out site/demo
      - name: Check the page holds no address it would fetch
        run: |
          python3 - <<'PY'
          import re, pathlib
          t = pathlib.Path("site/demo/index.html").read_text(encoding="utf-8")
          t = re.sub(r'<script id="demo-data" type="application/json">.*?</script>', "", t, flags=re.S)
          bad = [u for u in re.findall(r"https?://[^\s'\"<>)\\]+", t) if u != "http://www.w3.org/2000/svg"]
          assert not bad, bad
          PY
      - name: Copy the files the one-pager links into site/
        run: |
          mkdir -p site/img site/sample site/fonts
          cp docs/architecture.svg site/architecture.svg
          cp docs/img/demo-1280.png site/img/demo-1280.png
          cp "$DEMO_BUNDLE/out/report.html" site/sample/report.html
          cp ui/fonts/geist.woff2 site/fonts/geist.woff2
          cp ui/fonts/geistmono.woff2 site/fonts/geistmono.woff2
          cp ui/fonts/OFL.txt site/fonts/OFL.txt
      - name: Check the one-pager (no fetchable address, every link resolves)
        run: python3 -m unittest discover -s tests -p test_site.py -v
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
