<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">swarmlabre: where each part runs and what is trusted</title>
  <desc id="d">A sample is parsed on the host. Two containers without a network prepare it and run up to six agents. The agents post findings to a board on the host, which checks each one against the file's bytes and the tool calls the agent made. Reports are written from the checked findings and the run is sealed with a manifest. A recorded run replays offline and is compared byte for byte with the manifest.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fa5a2"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5fd3a0"/></marker>
  </defs>
  <style>
    .bg{fill:#0d1315}
    .box{fill:#131b1e;stroke:#2e3f44;stroke-width:1.2}
    .host{fill:none;stroke:#2e3f44;stroke-width:1.2;stroke-dasharray:2 5}
    .jail{fill:#101a17;stroke:#5fd3a0;stroke-width:1.4;stroke-dasharray:7 5}
    .ok{fill:#122220;stroke:#5fd3a0;stroke-width:1.2}
    .un{fill:#1d1717;stroke:#d9826f;stroke-width:1.2}
    .h{font-size:15px;font-weight:600;fill:#e7eeeb}
    .s{font-size:12.5px;fill:#a9b8b5}
    .t{font-size:13px;font-weight:600;fill:#8fa5a2;letter-spacing:.04em}
    .g{font-size:12.5px;fill:#5fd3a0}
    .r{font-size:12.5px;fill:#d9826f}
    .l{font-size:12px;fill:#8fa5a2}
    .a{stroke:#8fa5a2;stroke-width:1.4;fill:none}
    .ab{stroke:#5fd3a0;stroke-width:1.6;fill:none}
  </style>
  <rect class="bg" width="1000" height="640" rx="10"/>

  <!-- title -->
  <text x="30" y="36" class="h" font-size="17">swarmlabre: where each part runs, and what is trusted</text>
  <text x="30" y="56" class="l">Red outline: bytes or text somebody else wrote. Green outline: checked by swarmlabre. Dashed green: no network, read-only root, all capabilities dropped.</text>

  <!-- host -->
  <rect class="host" x="195" y="78" width="780" height="420" rx="10"/>
  <text x="210" y="100" class="t">HOST: swarmlabre, Python 3.12 standard library</text>

  <!-- sample -->
  <rect class="un" x="20" y="130" width="150" height="76" rx="8"/>
  <text x="34" y="156" class="h">Sample</text>
  <text x="34" y="176" class="s">ELF, PE or APK</text>
  <text x="34" y="194" class="r">untrusted bytes</text>

  <!-- model -->
  <rect class="un" x="20" y="372" width="150" height="104" rx="8"/>
  <text x="34" y="398" class="h">Model</text>
  <text x="34" y="418" class="s">OpenAI-compatible</text>
  <text x="34" y="434" class="s">endpoint, a scripted</text>
  <text x="34" y="450" class="s">mock, or a recording</text>
  <text x="34" y="468" class="r">untrusted text</text>

  <!-- host parse -->
  <rect class="ok" x="215" y="118" width="250" height="76" rx="8"/>
  <text x="229" y="144" class="h">Host parse</text>
  <text x="229" y="163" class="s">hashes, layout, header, manifest:</text>
  <text x="229" y="179" class="s">swarmlabre's own reading of the file</text>

  <!-- gate -->
  <rect class="ok" x="215" y="364" width="250" height="112" rx="8"/>
  <text x="229" y="390" class="h">Model gate</text>
  <text x="229" y="409" class="s">Unix socket, one per run</text>
  <text x="229" y="425" class="s">forces temperature and seed</text>
  <text x="229" y="441" class="s">adds the key; the container never</text>
  <text x="229" y="457" class="s">sees it; records every exchange</text>

  <!-- containers -->
  <rect class="jail" x="500" y="112" width="250" height="372" rx="10"/>
  <text x="514" y="134" class="g" font-weight="600">TWO CONTAINERS, --network none</text>
  <rect class="box" x="516" y="148" width="218" height="104" rx="8"/>
  <text x="530" y="174" class="h">tools</text>
  <text x="530" y="193" class="s">Ghidra, jadx, Apktool read the</text>
  <text x="530" y="209" class="s">sample (read-only) once and</text>
  <text x="530" y="225" class="s">write the files agents read:</text>
  <text x="530" y="241" class="s">decompiled code, strings, imports</text>
  <rect class="box" x="516" y="290" width="218" height="178" rx="8"/>
  <text x="530" y="316" class="h">agents</text>
  <text x="530" y="335" class="s">pi coding agent, up to six roles,</text>
  <text x="530" y="351" class="s">each under its own uid. They read</text>
  <text x="530" y="367" class="s">the prepared files, ask the tool</text>
  <text x="530" y="383" class="s">server, and report only with</text>
  <text x="530" y="399" class="s">swarm-post, which prints one</text>
  <text x="530" y="415" class="s">line with a per-task secret.</text>
  <text x="530" y="438" class="r">everything they print is untrusted</text>
  <text x="530" y="456" class="r">text, capped and never executed</text>

  <!-- board -->
  <rect class="ok" x="780" y="118" width="185" height="172" rx="8"/>
  <text x="794" y="144" class="h">Board</text>
  <text x="794" y="163" class="s">checks every post:</text>
  <text x="794" y="181" class="s">bytes at the offset</text>
  <text x="794" y="197" class="s">tool calls really made</text>
  <text x="794" y="213" class="s">ATT&amp;CK id and name</text>
  <text x="794" y="229" class="s">caps, duplicates, disputes</text>
  <text x="794" y="251" class="g">gives each one a level:</text>
  <text x="794" y="267" class="g">byte-checked, call-cited,</text>
  <text x="794" y="281" class="g">claimed</text>

  <!-- reports -->
  <rect class="ok" x="780" y="304" width="185" height="100" rx="8"/>
  <text x="794" y="330" class="h">Reports</text>
  <text x="794" y="349" class="s">html, md, json, board.json,</text>
  <text x="794" y="365" class="s">iocs.csv, STIX, MISP, YARA:</text>
  <text x="794" y="381" class="s">fixed templates over facts;</text>
  <text x="794" y="397" class="s">model text is labelled</text>

  <!-- sealed run -->
  <rect class="ok" x="780" y="424" width="185" height="66" rx="8"/>
  <text x="794" y="450" class="h">Sealed run</text>
  <text x="794" y="469" class="s">inputs, events, trace,</text>
  <text x="794" y="483" class="s">manifest: SHA-256 of all</text>

  <!-- arrows -->
  <path class="a" d="M170 160 H213" marker-end="url(#ar)"/>
  <path class="a" d="M465 160 H514" marker-end="url(#ar)"/>
  <text x="469" y="148" class="l">stage</text>
  <path class="a" d="M625 252 V288" marker-end="url(#ar)"/>
  <path class="a" d="M514 430 H467" marker-end="url(#ar)"/>
  <text x="472" y="422" class="l">requests</text>
  <path class="a" d="M213 424 H172" marker-end="url(#ar)"/>
  <text x="170" y="360" class="l">pinned request</text>
  <path class="ab" d="M734 340 H766 V230 H778" marker-end="url(#ag)"/>
  <text x="738" y="332" class="l">posts</text>
  <path class="ab" d="M872 290 V302" marker-end="url(#ag)"/>
  <path class="ab" d="M872 404 V422" marker-end="url(#ag)"/>

  <!-- replay and UI -->
  <rect class="ok" x="20" y="520" width="470" height="100" rx="8"/>
  <text x="34" y="546" class="h">Replay: offline, no model, no Docker, no network</text>
  <text x="34" y="567" class="s">recorded inputs → board → every report file → compare each</text>
  <text x="34" y="583" class="s">with the SHA-256 in manifest.json. One differing byte = exit 1.</text>
  <text x="34" y="604" class="g">That comparison is the reproducibility claim.</text>
  <rect class="ok" x="510" y="520" width="470" height="100" rx="8"/>
  <text x="524" y="546" class="h">Web UI: one page, three modes</text>
  <text x="524" y="567" class="s">live (needs Docker and a model), replay (swarmlabre serve --replay),</text>
  <text x="524" y="583" class="s">static (GitHub Pages, no server). Replay and static show a</text>
  <text x="524" y="599" class="s">recording: it is a view, not new evidence.</text>
  <path class="ab" d="M872 490 V518" marker-end="url(#ag)" stroke-dasharray="4 4"/>
  <path class="ab" d="M872 504 H255 V518" marker-end="url(#ag)" stroke-dasharray="4 4"/>
  <text x="560" y="516" class="l">a sealed run is what both read</text>
</svg>
